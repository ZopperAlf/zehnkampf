  if(rest==0||sb)ct+=`<button class="${rest>0?'alt':''}" ${n?'':'disabled'} onclick="fzGo(1)">${rest==0?'Festhalten':(t=='lj'?'Festhalten & Absprung':'Festhalten & Stopp')}</button>`}
 return [`<div class="info">${lab}</div><div class="dice">${dh}</div>`,ct]}
/* High jump / pole vault */
const MAXH={hj:30,pv:48};
function adv(rm){const j=J;j.last=null;j.msg='';j.tries=0;if(rm)j.act.splice(j.pos,1);else j.pos++;
 if(j.pos>=j.act.length){j.h+=2;j.pos=0}
 if(!j.act.length||j.h>MAXH[D[d].t])return endDisc();j.ph='choose';render()}
function jc(a){if(a==1){J.ph='jump';J.tries=0;J.last=null;J.msg='';render()}else if(a==0)adv(false);else adv(true)}
function jn(x){J.n=Math.max(1,Math.min(8,J.n+x));render()}
function jr(){RL=1;const j=J,p=j.act[j.pos],pv=D[d].t=='pv',n=pv?j.n:5;
 const dc=[...Array(n)].map(R),s=sum(dc),one=pv&&dc.includes(1);j.last=dc;j.sum=s;
 if(s>=j.h&&!one){best[p]=j.h;j.ph='res';j.ok=1;j.out=0;j.msg='Geschafft! '+s+' ≥ '+j.h}
 else{j.tries++;if(j.tries>=3){j.ph='res';j.ok=0;j.out=1;j.msg='Höhe '+j.h+' dreimal gerissen – ausgeschieden'}else j.msg='Fehlversuch ('+(one?'eine 1':s+' < '+j.h)+')'}
 render()}
function jx(){adv(J.out)}
function rJ(){const j=J,pv=D[d].t=='pv';let dh=`<div class="info">Höhe <b>${j.h}</b>${j.ph=='jump'?` · Versuch ${j.tries+1}/3`:''}</div>`,ct='';
 if(j.last)dh+=`<div class="dice">`+j.last.map(v=>`<div class="die${pv&&v==1?' x':''}">${G[v-1]}</div>`).join('')+`</div><div class="info">Summe <b>${j.sum}</b></div>`;
 if(j.ph=='choose')ct=`<button onclick="jc(1)">Höhe ${j.h} springen</button><button class="alt" onclick="jc(0)">Auslassen</button><button class="alt" onclick="jc(2)">Ausscheiden (Ergebnis behalten)</button>`;
 else if(j.ph=='jump'){if(pv)ct+=`<div class="row"><button class="alt sq" onclick="jn(-1)">−</button><b class="cnt">${j.n} Würfel</b><button class="alt sq" onclick="jn(1)">+</button></div>`;
  ct+=(j.msg?`<div class="res bad">${j.msg}</div>`:'')+`<button onclick="jr()">Würfeln</button>`}
 else ct=`<div class="res ${j.ok?'':'bad'}">${j.msg}</div><button onclick="jx()">Weiter</button>`;
 return [dh,ct]}
/* Rendering */
function board(cp){return '<div class="bd">'+P.map((x,i)=>`<div class="pc${i==cp?' on':''}"><span>${E(x.short||x.name)}</span><b>${tot(i)}</b></div>`).join('')+'</div>'}
function guide(){return `<details><summary>Kurzanleitung</summary><div class="card" style="font-size:14px"><b>Ziel:</b> In den gewählten Disziplinen (Standard: alle 10) möglichst viele Punkte sammeln. Wer nach der letzten die meisten hat, gewinnt.<br><br><b>Ablauf:</b> Die Disziplinen sind unabhängig. Ab der zweiten beginnt der aktuell Führende. Bei mehreren Versuchen kommen erst alle Spieler mit Versuch 1 dran, dann mit Versuch 2 usw. Gewertet wird das beste Ergebnis.<br><br><b>Optionen:</b> „Disziplinen in zufälliger Reihenfolge“ mischt die zehn Disziplinen. Bei der Spielerreihenfolge gilt: „Spitzenreiter startet zuerst“ (Standard) lässt den Punktbesten beginnen, bei Gleichstand bleibt die Reihenfolge der letzten Disziplin. „Jede Runde auslosen“ würfelt die Reihenfolge in jeder Disziplin neu, „Feste Reihenfolge“ bleibt wie eingetragen. Das gilt für normale Spiele und den Tisch-Modus. Im Knockout sind die Disziplinen immer zufällig.<br><br><b>Knockout:</b> 16, 32 oder 64 Spieler, nur mit Spieler 1. In jeder Runde gilt eine zufällige Disziplin. Du trittst gegen einen Computer-Gegner an, wer mehr Punkte hat, kommt weiter. Bei Gleichstand gibt es ein Stechen. Die anderen Duelle werden simuliert.<br><br><b>Spieler:</b> Jeder bekommt zufällig eine Nation (Flagge) und einen typischen Vor- und Nachnamen; ♂/♀ gilt für alle. Flagge und Name könnt ihr jederzeit ändern, 🎲 mischt neu.<br><br><b>Am Tisch:</b> Mit „Am Tisch spielen“ ist die App nur Begleiter: Sie zeigt Regeln und Reihenfolge, ihr würfelt echt und tragt die Punkte selbst ein.<br><br><b>Computer:</b> Aktiviere beim Start bei einem Spieler die Option 🤖. Der Computer würfelt dann automatisch, du siehst sein Ergebnis und tippst auf <i>Weiter</i>. Charakter: <i>vorsichtig</i> nimmt sichere Ergebnisse früh mit, <i>riskant</i> geht auf Höchstwerte und riskiert ungültige Versuche, <i>ausgewogen</i> liegt dazwischen.<br><br><b>Bedienung:</b> Mit <i>Würfeln</i> wirfst du. Beim Festhalten tippst du die gewünschten Würfel an (blau markiert) und bestätigst. Festgehaltene Würfel sind rot umrandet, abgeblasste Würfel sind nicht erlaubt.<br><br><b>Laufdisziplinen (100 m, 400 m, 1500 m, Hürden):</b> Würfel in Sätzen werfen, jeden Satz mit <i>Behalten</i> festlegen oder neu würfeln (insgesamt 5 Neuwürfe). Sechsen zählen minus 6, nur bei den Hürden normal.<br><br><b>Weitsprung:</b> Anlauf mit 5 Würfeln, Festhaltesumme max. 8, sonst ungültig. Danach springst du mit den festgehaltenen Würfeln und willst hohe Werte.<br><br><b>Kugelstoßen:</b> Bis zu 8 Würfel nacheinander, jederzeit Stopp. Eine 1 = ungültig.<br><br><b>Diskus / Speer:</b> Pro Wurf mind. 1 Würfel festhalten, Diskus nur gerade, Speer nur ungerade. Gibt es keinen erlaubten Würfel, ist der Versuch ungültig.<br><br><b>Hoch- / Stabhochsprung:</b> Start bei 10, Schritte von 2. Pro Höhe springen oder auslassen, 3 Versuche. Hochsprung: 5 Würfel, Summe ≥ Höhe. Stabhochsprung: Würfelzahl frei wählbar (max. 8), Summe ≥ Höhe und keine 1. Dreimal gerissen = ausgeschieden.</div></details>`}
function table(){return guide()+`<details><summary>Punktetabelle</summary><table><tr><th></th>${P.map(x=>`<th>${E(x.name)}</th>`).join('')}</tr>`+D.slice(0,ND).map((c,r)=>`<tr><td>${c.n}</td>${P.map((_,i)=>`<td>${S[i][r]??'–'}</td>`).join('')}</tr>`).join('')+`<tr><td><b>Summe</b></td>${P.map((_,i)=>`<td><b>${tot(i)}</b></td>`).join('')}</tr></table></details>`}
function render(){const a=$('app');
 if(mode=='setup'){if(!nat.length)loadP();saveP();let h=`<h1>Zehnkampf</h1><div class="rule">Würfelspiel angelehnt an Zehnkampf von Reiner Knizia</div><div class="card"><b>Spieleranzahl</b><div class="row">`+[1,2,3,4].map(n=>`<button class="${n==NP?'':'alt'}" onclick="setN(${n})">${n}</button>`).join('')+'</div>';
  h+=`<div class="row"><button class="${gen==0?'':'alt'}" onclick="setG(0)">♂ Männlich</button><button class="${gen==1?'':'alt'}" onclick="setG(1)">♀ Weiblich</button><button class="alt sq" onclick="shuf()">🎲</button></div>`;for(let i=0;i<NP;i++)h+=`<div class="row"><select id="f${i}" onchange="natCh(${i})" style="flex:0 0 auto;font-size:22px;padding:6px 2px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--fg)">${NAT.map((n,k)=>`<option value="${k}"${nat[i]==k?' selected':''}>${n.f}</option>`).join('')}</select><input id="n${i}" placeholder="Vorname" oninput="ed[${i}]=1" maxlength="14" value="${E(names[i]||'Spieler '+(i+1))}"><input id="l${i}" placeholder="Nachname" oninput="ed[${i}]=1" maxlength="14" value="${E(lns[i]||'')}"><label style="white-space:nowrap;font-size:14px">🤖 <input type="checkbox" id="c${i}" onchange="$('s${i}').style.display=this.checked?'':'none'" ${cpu[i]?'checked':''} style="width:22px;height:22px;margin:0;vertical-align:middle"></label></div><select id="s${i}" style="${cpu[i]?'':'display:none;'}width:100%;padding:8px;margin:0 0 8px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);font-size:14px">${['vorsichtig','ausgewogen','riskant'].map((n,k)=>`<option value="${k}"${(sty[i]??1)==k?' selected':''}>Computer-Charakter: ${n}</option>`).join('')}</select>`;
  a.innerHTML=h+`<label class="opt"><input type="checkbox" id="rd" ${RD?'checked':''}> Disziplinen in zufälliger Reihenfolge</label><div class="rule" style="margin:10px 0 0">Spielerreihenfolge</div><label class="opt"><input type="radio" name="ro" value="2" ${RP==2?'checked':''}> Spitzenreiter startet zuerst</label><label class="opt"><input type="radio" name="ro" value="1" ${RP==1?'checked':''}> Spielerreihenfolge jede Runde auslosen</label><label class="opt"><input type="radio" name="ro" value="0" ${RP==0?'checked':''}> Feste Reihenfolge (wie eingetragen)</label><button onclick="start()">Spiel starten (App würfelt)</button><div class="sl"><label for="nd">Anzahl Disziplinen: <b id="ndv">${NDu}</b></label><input type="range" id="nd" min="1" max="10" value="${NDu}" oninput="NDu=+this.value;$('ndv').textContent=NDu"></div><button onclick="koStart(KN)" style="margin-top:16px">🏆 Knockout-Turnier starten</button><div class="rule" style="margin:0"><b>Teilnehmer</b> (nur Spieler 1, gegen Computer):</div><div class="row">${[16,32,64].map(n=>`<button class="${KN==n?'':'alt'}" onclick="grab();KN=${n};render()">${n}</button>`).join('')}</div><button class="alt" style="margin-top:16px" onclick="startOff()">Am Tisch spielen (echte Würfel)</button><div class="rule">Am Tisch: Die App zeigt Regeln und Reihenfolge, ihr würfelt selbst und tragt die Punkte ein.</div></div><button class="alt" onclick="mode='hs';render()">🏅 Highscores</button>`+guide()+`<div class="info" style="margin-top:18px;text-align:center">Inoffizielle Fan-Umsetzung, angelehnt an „Zehnkampf“ von Dr. Reiner Knizia (knizia.de). Nicht von ihm autorisiert; die Regeln sind frei nacherzählt.</div>`;return}
 if(mode=='hs')return hsScr();if(mode=='koi')return koiScr();if(mode=='kor')return korScr();
 if(mode=='off')return offScr();
 if(mode=='disc'){const o=P.map((_,i)=>i).sort((x,y)=>best[y]-best[x]);
  a.innerHTML=`${ban('Ergebnis')}`+board(-1)+`<div class="card">`+o.map(i=>`<div class="rk"><span>${E(P[i].name)}</span><b>${best[i]}</b></div>`).join('')+`</div><button onclick="nextD()">${d==ND-1?'Endergebnis':'Nächste Disziplin'}</button>${OFF?'<button class="alt" onclick="corr()">Eingabe korrigieren</button>':''}`+table();return}
 if(mode=='end')return endScr();
 if(0){const o=P.map((_,i)=>i).sort((x,y)=>tot(y)-tot(x));
  a.innerHTML=`<h1>Endergebnis</h1><div class="card">`+o.map((i,k)=>`<div class="rk"><span>${['🥇','🥈','🥉','4.'][k]} ${E(P[i].name)}</span><b>${tot(i)}</b></div>`).join('')+`</div>`+table()+`<button onclick="mode='setup';render()">Neues Spiel</button>`;return}
 const c=D[d],jm=c.t=='hj'||c.t=='pv',p=jm?J.act[J.pos]:q[qi][0];let dh,ct;
 if(jm){if(P[p].cpu&&J.ph=='choose')cpuJ();[dh,ct]=rJ()}else{if(st.cpu)dh=st.cpu;else[dh,ct]=c.t=='sets'?rSE():c.t=='sp'?rSP():rFZ();
  if(st.res)ct=`<div class="res ${st.res.v?'':'bad'}">${st.res.msg?st.res.msg+'<br>':''}<b>${st.res.v} Punkte</b></div><button onclick="nx()">Weiter</button>`}
 a.innerHTML=`${ban(KO?rname(KO.A.length):'')}<div class="rule">${c.r}</div>`+board(p)+`<div class="card"><div class="who">${E(P[p].name)} <small>${!jm&&A>1?'· Versuch '+(q[qi][1]+1)+'/'+A+' · ':'· '}bisher ${best[p]}</small></div>${dh}${ct}</div>`+table()}
render();
</script></body></html>
